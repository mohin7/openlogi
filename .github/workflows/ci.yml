name: CI

# Runs on every push and pull request. This is the gate that catches problems
# before a tag is cut — by the time release.yml runs, everything here has
# already passed.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete. Cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build scripts and proc macros are a large share of a cold Tauri build;
  # this keeps incremental artefacts small without hurting CI throughput.
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vue-tsc runs as part of `build`, so this covers typechecking too.
      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm --filter openlogi-desktop test

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # The Tauri crate needs webkit2gtk even to typecheck, so the system
      # dependencies are required here as well as in the release build.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config

      # rust-toolchain.toml pins the channel and requests clippy + rustfmt,
      # so no toolchain arguments are needed here.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
